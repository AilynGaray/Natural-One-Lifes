<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
body{
    font-family:'Segoe UI';
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 6px 16px rgba(0,0,0,0.1);
}

.circle{
    width:140px;
    height:140px;
    background:#e53935;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:70px;
    margin:auto;
}

button{
    margin:10px;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:#1565c0;
    color:white;
}
</style>
</head>
<body>

<div class="card">
<div class="circle">✖</div>
<h2>CANCELAR CITA</h2>
<button>INICIO</button>
<button>CITA</button>
</div>

</body>
</html>
