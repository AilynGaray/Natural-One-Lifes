<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pago exitoso</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .container {

            width: 92%;

            max-width: 500px;

            background: white;

            padding: 40px 30px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.10);

            text-align: center;

        }


        .icon {

            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #d4edda;

            color: #0a7d0a;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 45px;

            font-weight: bold;

        }


        h1 {

            color: #0a7d0a;

            font-size: 28px;

            margin-bottom: 15px;

        }


        p {

            color: #555;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 10px;

        }


        .success {

            background: #f0fff0;

            border: 1px solid #b7dfb7;

            border-radius: 8px;

            padding: 15px;

            margin: 20px 0;

            color: #155724;

            font-size: 14px;

        }


        .buttons {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 25px;

        }


        .btn {

            display: block;

            width: 100%;

            padding: 13px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s;

        }


        .btn-primary {

            background: #0a7d0a;

            color: white;

        }


        .btn-primary:hover {

            background: #086908;

        }


        .btn-secondary {

            background: white;

            color: #0a7d0a;

            border: 1px solid #0a7d0a;

        }


        .btn-secondary:hover {

            background: #f0fff0;

        }


        @media (max-width: 500px) {

            .container {

                padding: 30px 20px;

            }


            h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        ✓
    </div>


    <h1>
        ¡Pago exitoso!
    </h1>


    <p>
        Tu pago ha sido procesado correctamente.
    </p>


    <div class="success">

        <strong>
            Pedido confirmado
        </strong>

        <br>

        Tu pedido ha sido registrado
        y está pendiente de preparación.

    </div>


    <div class="buttons">

        <a
            href="/catalogo"
            class="btn btn-primary"
        >
            Seguir comprando
        </a>


        <a
            href="/perfil"
            class="btn btn-secondary"
        >
            Ver mi perfil
        </a>

    </div>


</div>


</body>

</html>
