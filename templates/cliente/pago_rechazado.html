<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pago rechazado | Natural One Life</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{

    min-height:100vh;

    background:#f4f7f5;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}


.container{

    width:100%;

    max-width:500px;

    background:white;

    border-radius:20px;

    padding:40px 30px;

    text-align:center;

    border:1px solid #e3eae4;

    box-shadow:
        0 10px 30px rgba(0,0,0,.08);
}


.icon{

    width:75px;

    height:75px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#fff0f0;

    color:#d43d3d;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    font-weight:bold;
}


h1{

    color:#183b25;

    font-size:26px;

    margin-bottom:12px;
}


p{

    color:#6b7280;

    font-size:15px;

    line-height:1.6;

    margin-bottom:25px;
}


.mensaje{

    background:#fff5f5;

    border:1px solid #f0d4d4;

    color:#a32929;

    padding:15px;

    border-radius:10px;

    margin-bottom:25px;

    font-size:14px;
}


.btn{

    display:block;

    width:100%;

    padding:13px;

    border-radius:10px;

    text-decoration:none;

    background:#087f23;

    color:white;

    font-size:14px;

    font-weight:700;

    transition:.25s;
}


.btn:hover{

    background:#066d1e;

    transform:translateY(-2px);
}

</style>

</head>

<body>

<div class="container">

    <div class="icon">
        ×
    </div>

    <h1>
        Pago rechazado
    </h1>

    <p>
        No fue posible procesar el pago de tu pedido.
    </p>

    <div class="mensaje">

        Tu carrito permanece disponible.
        Puedes revisar tus productos e intentar nuevamente.

    </div>

    <a
        href="{{ url_for('ver_carrito') }}"
        class="btn"
    >
        Volver al carrito
    </a>

</div>

</body>

</html>
