<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Producto</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
}

body{
    background:#eef5ee;
    color:#333;
    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:70px;
    background:#0b7a33;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.logo{
    color:white;
    font-size:23px;
    font-weight:700;
    letter-spacing:.3px;
}

.logo span{
    color:#b8ffd2;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid white;
    background:#e0e0e0;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container{
    width:92%;
    max-width:900px;
    margin:42px auto;
    background:white;
    padding:38px 42px;
    border-radius:16px;
    border:1px solid #e3e9e3;
    box-shadow:0 8px 25px rgba(0,0,0,.09);
}


/* =====================================================
   TÍTULO
===================================================== */

h1{
    text-align:left;
    margin-bottom:32px;
    color:#0b7a33;
    font-size:28px;
    font-weight:700;
    padding-bottom:16px;
    border-bottom:1px solid #e5e5e5;
}


/* =====================================================
   FORMULARIO
===================================================== */

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#444;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    padding:13px 14px;
    border:1px solid #d5d5d5;
    border-radius:9px;
    font-size:14px;
    color:#333;
    background:#fff;
    outline:none;
    transition:.2s ease;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#0b7a33;
    box-shadow:0 0 0 3px rgba(11,122,51,.10);
}

textarea{
    min-height:125px;
    resize:vertical;
    line-height:1.5;
}


/* =====================================================
   CAMPOS PRECIO / STOCK
===================================================== */

.row{
    display:flex;
    gap:20px;
    margin-bottom:22px;
}

.col{
    flex:1;
}

.col label{
    margin-bottom:8px;
}


/* =====================================================
   SELECT
===================================================== */

select{
    cursor:pointer;
}


/* =====================================================
   VISTA PREVIA
===================================================== */

.preview{
    margin:25px 0 22px;
    padding:22px;
    background:#f7faf7;
    border:1px solid #e2e9e2;
    border-radius:12px;
    text-align:center;
}

.preview::before{
    content:"Vista previa de la imagen";
    display:block;
    color:#666;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
}

.preview img{
    width:210px;
    height:210px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #dfe5df;
    background:white;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}


/* =====================================================
   ARCHIVO
===================================================== */

input[type="file"]{
    padding:10px;
    background:#fafafa;
    cursor:pointer;
}

input[type="file"]::file-selector-button{
    background:#0b7a33;
    color:white;
    border:none;
    padding:8px 13px;
    margin-right:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}

input[type="file"]::file-selector-button:hover{
    background:#075c26;
}


/* =====================================================
   BOTONES
===================================================== */

.botones{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-top:32px;
    padding-top:22px;
    border-top:1px solid #eeeeee;
}

.btn{
    min-width:160px;
    padding:13px 25px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    text-align:center;
    transition:.2s ease;
}

.guardar{
    background:#0b7a33;
    color:white;
    box-shadow:0 3px 8px rgba(11,122,51,.20);
}

.guardar:hover{
    background:#075c26;
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(11,122,51,.25);
}

.cancelar{
    background:#d9d9d9;
    color:#444;
}

.cancelar:hover{
    background:#c8c8c8;
    transform:translateY(-1px);
}

.botones a{
    text-decoration:none;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    .header{
        height:65px;
        padding:0 20px;
    }

    .logo{
        font-size:19px;
    }

    .avatar{
        width:40px;
        height:40px;
    }

    .container{
        width:94%;
        margin:25px auto;
        padding:25px 20px;
        border-radius:14px;
    }

    h1{
        font-size:24px;
        margin-bottom:25px;
    }

    .row{
        flex-direction:column;
        gap:0;
        margin-bottom:0;
    }

    .row .col{
        margin-bottom:22px;
    }

    .preview img{
        width:180px;
        height:180px;
    }

    .botones{
        flex-direction:column-reverse;
        align-items:stretch;
    }

    .btn{
        width:100%;
        min-width:0;
    }

}

@media(max-width:400px){

    .container{
        width:95%;
        padding:22px 16px;
    }

    .logo{
        font-size:17px;
    }

    h1{
        font-size:22px;
    }

    .preview img{
        width:160px;
        height:160px;
    }

}

</style>

</head>

<body>


<header class="header">

    <div class="logo">

        Natural <span>One Life</span>

    </div>

    <div class="avatar">

        <img
            src="{{ url_for('static', filename='img/perfil.jpg') }}"
            alt="Perfil"
        >

    </div>

</header>


<div class="container">

    <h1>
        Editar Producto
    </h1>


    <form
        action="/actualizar-producto/{{ producto.idPro }}"
        method="POST"
        enctype="multipart/form-data"
    >


        <div class="form-group">

            <label>
                Nombre
            </label>

            <input
                type="text"
                name="nombre"
                value="{{ producto.nombrePro }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Descripción
            </label>

            <textarea
                name="descripcion"
                required
            >{{ producto.descripcionPro }}</textarea>

        </div>


        <div class="row">

            <div class="col">

                <label>
                    Precio
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="precio"
                    value="{{ producto.precioPro }}"
                    required
                >

            </div>


            <div class="col">

                <label>
                    Stock
                </label>

                <input
                    type="number"
                    name="stock"
                    value="{{ producto.stockPro }}"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Categoría
            </label>

            <select name="categoria">

                {% for categoria in categorias %}

                    <option
                        value="{{ categoria.idCat }}"
                        {% if categoria.idCat == producto.nombreCat %}
                            selected
                        {% endif %}
                    >

                        {{ categoria.nombreCat }}

                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="preview">

            <img
                id="preview"
                src="{{ url_for('static', filename='img/' + producto.imagenesPro) }}"
                alt="Vista previa del producto"
            >

        </div>


        <div class="form-group">

            <label>
                Cambiar imagen
            </label>

            <input
                type="file"
                name="imagen"
                accept="image/*"
                onchange="previewImage(event)"
            >

        </div>


        <div class="botones">

            <a href="/gestion-productos">

                <button
                    type="button"
                    class="btn cancelar"
                >
                    Cancelar
                </button>

            </a>


            <button
                class="btn guardar"
                type="submit"
            >
                <i class="fa-solid fa-floppy-disk"></i>
                Guardar Cambios
            </button>

        </div>

    </form>

</div>


<script>

function previewImage(event){

    const archivo = event.target.files[0];

    if(archivo){

        document.getElementById("preview").src =
            URL.createObjectURL(archivo);

    }

}

</script>


</body>

</html>
