<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuevo profesional | Natural One Life</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI", Arial, sans-serif;
        }


        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px 20px;

            background:
                linear-gradient(
                    rgba(20,85,40,.78),
                    rgba(8,55,25,.82)
                ),
                url("{{ url_for('static', filename='img/fondo-login.jpeg') }}")
                center/cover no-repeat fixed;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .container{

            width:100%;

            max-width:900px;

            background:rgba(255,255,255,.98);

            padding:42px 50px;

            border-radius:20px;

            border:1px solid rgba(255,255,255,.7);

            box-shadow:
                0 20px 55px rgba(0,0,0,.30);
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        .header{

            text-align:center;

            padding-bottom:25px;

            margin-bottom:30px;

            border-bottom:1px solid #e8eee8;
        }


        .logo{

            color:#2e7d32;

            font-size:32px;

            font-weight:800;

            letter-spacing:.2px;
        }


        .header p{

            margin-top:8px;

            color:#777;

            font-size:14px;
        }


        /* =====================================================
           FORMULARIO
        ===================================================== */

        .form-grid{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:21px 22px;
        }


        .field{

            display:flex;

            flex-direction:column;
        }


        .field.full{

            grid-column:1 / -1;
        }


        /* =====================================================
           ETIQUETAS
        ===================================================== */

        label{

            margin-bottom:8px;

            color:#315f37;

            font-size:13px;

            font-weight:700;
        }


        /* =====================================================
           CAMPOS
        ===================================================== */

        input{

            width:100%;

            height:48px;

            padding:0 14px;

            border:1px solid #d5ddd5;

            border-radius:9px;

            background:#fbfdfb;

            color:#333;

            font-size:14px;

            outline:none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        input::placeholder{

            color:#aaa;
        }


        input:hover{

            border-color:#b8c8b9;
        }


        input:focus{

            border-color:#43a047;

            box-shadow:
                0 0 0 3px
                rgba(67,160,71,.12);

            background:#fff;
        }


        /* =====================================================
           INFORMACIÓN CONTRASEÑA
        ===================================================== */

        .password-info{

            margin-top:7px;

            color:#888;

            font-size:11.5px;

            line-height:1.4;
        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        #mensaje{

            display:none;

            margin-bottom:20px;

            padding:13px 16px;

            border-radius:9px;

            font-size:14px;

            font-weight:600;

            text-align:center;

            border:1px solid transparent;
        }


        /* =====================================================
           BOTÓN
        ===================================================== */

        button{

            width:100%;

            height:50px;

            margin-top:27px;

            border:0;

            border-radius:9px;

            background:#2e7d32;

            color:white;

            font-size:15px;

            font-weight:700;

            cursor:pointer;

            transition:
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;

            box-shadow:
                0 5px 14px
                rgba(46,125,50,.20);
        }


        button:hover{

            background:#1b5e20;

            transform:translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(46,125,50,.25);
        }


        button:active{

            transform:translateY(0);
        }


        button:disabled{

            opacity:.7;

            cursor:not-allowed;

            transform:none;

            box-shadow:none;
        }


        /* =====================================================
           PIE DEL FORMULARIO
        ===================================================== */

        .footer{

            text-align:center;

            margin-top:22px;

            padding-top:18px;

            border-top:1px solid #eeeeee;

            font-size:13px;

            color:#777;
        }


        .footer a{

            color:#2e7d32;

            text-decoration:none;

            font-weight:700;

            transition:.2s ease;
        }


        .footer a:hover{

            color:#1b5e20;

            text-decoration:underline;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width:700px){

            body{

                padding:20px 12px;

                align-items:flex-start;

                padding-top:30px;
            }


            .container{

                padding:30px 24px;

                border-radius:17px;
            }


            .header{

                padding-bottom:22px;

                margin-bottom:24px;
            }


            .logo{

                font-size:27px;
            }


            .header p{

                font-size:13px;
            }


            .form-grid{

                grid-template-columns:1fr;

                gap:17px;
            }


            .field.full{

                grid-column:auto;
            }


            input{

                height:47px;
            }


            button{

                height:49px;

                margin-top:24px;
            }
        }


        @media(max-width:400px){

            body{

                padding:15px 10px;
            }


            .container{

                padding:25px 18px;

                border-radius:15px;
            }


            .logo{

                font-size:24px;
            }


            .header p{

                font-size:12px;
            }


            label{

                font-size:12px;
            }


            input{

                font-size:13px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            Natural One Life
        </div>

        <p>
            Registrar nuevo profesional
        </p>

    </div>


    <div
        id="mensaje"
        role="alert"
        aria-live="polite"
    ></div>


    <form id="profesionalForm">


        <div class="form-grid">


            <div class="field">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del profesional"
                    required
                >

            </div>


            <div class="field">

                <label for="apellido">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Apellidos del profesional"
                    required
                >

            </div>


            <div class="field full">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="profesional@naturalonelife.com"
                    required
                >

            </div>


            <div class="field">

                <label for="usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuario para iniciar sesión"
                    required
                >

            </div>


            <div class="field">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="Número de teléfono"
                >

            </div>


            <div class="field full">

                <label for="especialidad">
                    Especialidad
                </label>

                <input
                    type="text"
                    id="especialidad"
                    placeholder="Ej: Medicina natural"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                >

                <span class="password-info">
                    La contraseña será almacenada de forma cifrada.
                </span>

            </div>


            <div class="field">

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    placeholder="Repite la contraseña"
                    required
                >

            </div>


        </div>


        <button
            type="submit"
            id="btnCrear"
        >
            Crear profesional
        </button>


    </form>


    <div class="footer">

        <a href="/dashboard">
            ← Volver al panel
        </a>

    </div>


</div>


<script src="{{ url_for(
    'static',
    filename='js/nuevo_profesional.js'
) }}"></script>


</body>

</html>
