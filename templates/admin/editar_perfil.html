<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Perfil | Natural One Life</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
}

body{

    background:#F8F5EF;

    color:#333;

    min-height:100vh;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    width:100%;
    height:68px;

    background:#008800;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 34px;

    color:white;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);
}

.logo{

    font-size:23px;

    font-weight:700;

    font-style:italic;
}

.nav-avatar{

    width:46px;
    height:46px;

    border-radius:50%;

    border:3px solid white;

    object-fit:cover;

    box-shadow:
        0 2px 7px rgba(0,0,0,.2);
}

.avatar-default{

    background:#e0e0e0;

    color:#777;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container{

    width:100%;

    max-width:1100px;

    margin:0 auto;

    padding:38px 30px;
}


/* =====================================================
   ENCABEZADO
===================================================== */

.page-header{

    margin-bottom:28px;
}

.title-wrapper{

    display:flex;

    align-items:center;

    gap:12px;
}

.title-line{

    width:5px;

    height:30px;

    background:#008800;

    border-radius:5px;
}

.title{

    font-size:29px;

    color:#222;

    font-weight:700;
}

.subtitle{

    margin-top:7px;

    margin-left:17px;

    color:#777;

    font-size:13px;
}


/* =====================================================
   FORMULARIO HORIZONTAL
===================================================== */

.edit-card{

    background:white;

    border-radius:16px;

    border:1px solid #e7e2da;

    box-shadow:
        0 3px 8px rgba(0,0,0,.07),
        0 12px 30px rgba(0,0,0,.05);

    padding:30px;
}


/* =====================================================
   CONTENIDO
===================================================== */

.form-content{

    display:grid;

    grid-template-columns:230px 1fr;

    gap:35px;

    align-items:start;
}


/* =====================================================
   FOTO
===================================================== */

.photo-section{

    display:flex;

    flex-direction:column;

    align-items:center;
}

.profile{

    width:145px;
    height:145px;

    border-radius:50%;

    border:4px solid #008800;

    object-fit:cover;

    box-shadow:
        0 4px 14px rgba(0,0,0,.10);

    margin-bottom:15px;
}

.profile-default{

    background:#e0e0e0;

    color:#777;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:60px;
}

.photo-label{

    font-size:12px;

    color:#777;

    text-align:center;

    line-height:1.5;
}


/* =====================================================
   FORMULARIO
===================================================== */

.form-fields{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.form-group{

    display:flex;

    flex-direction:column;
}

.form-group.full{

    grid-column:1 / -1;
}

label{

    font-size:13px;

    font-weight:700;

    color:#444;

    margin-bottom:7px;
}

input{

    width:100%;

    height:43px;

    border:1px solid #d8d8d8;

    border-radius:8px;

    padding:0 13px;

    font-size:13px;

    color:#333;

    outline:none;

    background:white;

    transition:.2s ease;
}

input:focus{

    border-color:#008800;

    box-shadow:
        0 0 0 3px rgba(0,136,0,.10);
}

input[type="file"]{

    padding:9px 11px;

    cursor:pointer;
}


/* =====================================================
   BOTONES
===================================================== */

.buttons{

    display:flex;

    gap:12px;

    margin-top:25px;

    padding-top:22px;

    border-top:1px solid #eeeeee;
}

.btn{

    height:43px;

    padding:0 22px;

    border-radius:8px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s ease;
}

.btn-save{

    background:#008800;

    color:white;

    border:1px solid #008800;

    box-shadow:
        0 3px 8px rgba(0,136,0,.18);
}

.btn-save:hover{

    background:#006f00;

    border-color:#006f00;

    transform:translateY(-1px);
}

.btn-cancel{

    background:white;

    color:#555;

    border:1px solid #d8d8d8;
}

.btn-cancel:hover{

    background:#f3f3f3;

    transform:translateY(-1px);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    .container{

        padding:30px 20px;
    }

    .form-content{

        grid-template-columns:1fr;

    }

    .photo-section{

        margin-bottom:5px;
    }

}


@media(max-width:600px){

    .navbar{

        padding:0 18px;
    }

    .logo{

        font-size:20px;
    }

    .container{

        padding:25px 14px;
    }

    .edit-card{

        padding:22px 18px;
    }

    .title{

        font-size:24px;
    }

    .form-fields{

        grid-template-columns:1fr;
    }

    .form-group.full{

        grid-column:auto;
    }

    .buttons{

        flex-direction:column;
    }

    .btn{

        width:100%;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->





<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="container">


    <header class="page-header">

        <div class="title-wrapper">

            <span class="title-line"></span>

            <h1 class="title">
                Editar Perfil
            </h1>

        </div>

        <p class="subtitle">
            Actualiza la información personal de tu cuenta
        </p>

    </header>



    <!-- =================================================
         TARJETA
    ================================================== -->

    <section class="edit-card">


        <form
            action="{{ url_for('editar_perfil') }}"
            method="POST"
            enctype="multipart/form-data"
        >


            <div class="form-content">


                <!-- =====================================
                     FOTO
                ====================================== -->

                <div class="photo-section">


                    {% if usuario.fotoUsu %}

                        <img
                            src="{{ url_for('static', filename='img/perfiles/' + usuario.fotoUsu) }}"
                            class="profile"
                            id="preview"
                            alt="Foto de perfil"
                        >

                    {% else %}

                        <div
                            class="profile profile-default"
                            id="preview"
                        >
                            👤
                        </div>

                    {% endif %}


                    <div class="photo-label">

                        Selecciona una nueva foto<br>
                        para actualizar tu perfil.

                    </div>

                </div>



                <!-- =====================================
                     CAMPOS
                ====================================== -->

                <div class="form-fields">


                    <div class="form-group">

                        <label for="nombreUsu">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombreUsu"
                            name="nombreUsu"
                            value="{{ usuario.nombreUsu }}"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="apellidoUsu">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellidoUsu"
                            name="apellidoUsu"
                            value="{{ usuario.apellidoUsu }}"
                            required
                        >

                    </div>



                    <div class="form-group full">

                        <label for="correoUsu">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correoUsu"
                            name="correoUsu"
                            value="{{ usuario.correoUsu }}"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="telefonoUsu">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefonoUsu"
                            name="telefonoUsu"
                            value="{{ usuario.telefonoUsu or '' }}"
                            placeholder="Ej: 300 123 4567"
                        >

                    </div>



                    <div class="form-group">

                        <label for="fotoUsu">
                            Cambiar fotografía
                        </label>

                        <input
                            type="file"
                            id="fotoUsu"
                            name="fotoUsu"
                            accept="image/*"
                        >

                    </div>


                </div>

            </div>



            <!-- =====================================
                 BOTONES
            ====================================== -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Guardar cambios
                </button>


                <a
                    href="{{ url_for('perfil_admin') }}"
                    class="btn btn-cancel"
                >
                    Cancelar
                </a>

            </div>


        </form>


    </section>


</main>



<!-- =====================================================
     PREVISUALIZACIÓN DE FOTO
===================================================== -->

<script>

const fotoInput = document.getElementById("fotoUsu");
const preview = document.getElementById("preview");

fotoInput.addEventListener("change", function(){

    const archivo = this.files[0];

    if(!archivo){
        return;
    }

    const lector = new FileReader();

    lector.onload = function(e){

        if(preview.tagName === "IMG"){

            preview.src = e.target.result;

        }else{

            const img = document.createElement("img");

            img.src = e.target.result;

            img.className = "profile";

            img.id = "preview";

            img.alt = "Vista previa";

            preview.replaceWith(img);

        }

    };

    lector.readAsDataURL(archivo);

});

</script>


</body>

</html>
