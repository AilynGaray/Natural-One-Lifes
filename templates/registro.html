<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear cuenta | Natural One Life</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px;

    background:
        linear-gradient(
            rgba(20,85,40,.78),
            rgba(8,55,25,.82)
        ),
        url("{{ url_for('static', filename='img/fondo-login.jpeg') }}")
        center/cover no-repeat;
}

.container{
    width:100%;
    max-width:850px;
    background:rgba(255,255,255,.97);
    padding:42px 48px;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.28);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    color:#2e7d32;
    font-size:34px;
    font-weight:800;
    letter-spacing:.3px;
}

.header p{
    margin-top:8px;
    color:#777;
    font-size:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

label{
    margin-bottom:7px;
    color:#315f37;
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    height:50px;
    padding:0 14px;

    border:1px solid #d5ddd5;
    border-radius:10px;

    background:#fbfdfb;
    color:#333;

    font-size:15px;
    outline:none;

    transition:.25s;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    border-color:#43a047;

    box-shadow:
        0 0 0 3px rgba(67,160,71,.12);

    background:#fff;
}

.password-info{
    margin-top:7px;
    color:#888;
    font-size:12px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;

    margin:24px 0;

    color:#666;
    font-size:13px;
}

.checkbox input{
    width:17px;
    height:17px;

    accent-color:#2e7d32;

    cursor:pointer;
}

button{
    width:100%;
    height:52px;

    border:0;
    border-radius:10px;

    background:#2e7d32;
    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 6px 15px rgba(46,125,50,.2);
}

button:hover{
    background:#1b5e20;
    transform:translateY(-1px);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

.footer{
    text-align:center;
    margin-top:22px;

    font-size:14px;
    color:#777;
}

.footer a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:700;
}

.footer a:hover{
    text-decoration:underline;
}


/* ==========================================
   MENSAJES
========================================== */

.mensaje{
    display:none;

    margin-bottom:20px;
    padding:13px 16px;

    border-radius:10px;

    font-size:14px;
    font-weight:600;

    text-align:center;
}

.mensaje.error{
    display:block;

    background:#fff1f1;
    border:1px solid #f2b8b8;
    color:#b42318;
}

.mensaje.exito{
    display:block;

    background:#eef9f0;
    border:1px solid #b7dfbd;
    color:#246b2c;
}


/* ==========================================
   ERROR EN CAMPOS
========================================== */

.input-error{
    border-color:#d93025 !important;

    box-shadow:
        0 0 0 3px rgba(217,48,37,.10) !important;
}


/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:700px){

    body{
        padding:20px 12px;
    }

    .container{
        padding:30px 24px;
        border-radius:18px;
    }

    .logo{
        font-size:28px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:17px;
    }

    .field.full{
        grid-column:auto;
    }

}


@media(max-width:420px){

    .container{
        padding:25px 18px;
    }

    .logo{
        font-size:25px;
    }

    .header p{
        font-size:13px;
    }

    input{
        height:48px;
    }

    button{
        height:50px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Natural One Life
        </div>

        <p>
            Crea tu cuenta y comienza a utilizar nuestra plataforma
        </p>

    </div>


    <!-- ==========================================
         MENSAJE DEL SISTEMA
    =========================================== -->

    <div
        id="mensaje"
        class="mensaje"
        role="alert"
        aria-live="polite"
    ></div>


    <!-- ==========================================
         FORMULARIO
    =========================================== -->

    <form id="registroForm" novalidate>

        <div class="form-grid">


            <!-- NOMBRE -->

            <div class="field">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    autocomplete="given-name"
                    maxlength="100"
                    required
                >

            </div>


            <!-- APELLIDOS -->

            <div class="field">

                <label for="apellido">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingresa tus apellidos"
                    autocomplete="family-name"
                    maxlength="100"
                    required
                >

            </div>


            <!-- CORREO -->

            <div class="field full">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu.correo@ejemplo.com"
                    autocomplete="email"
                    maxlength="150"
                    required
                >

            </div>


            <!-- USUARIO -->

            <div class="field">

                <label for="usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Crea tu usuario"
                    autocomplete="username"
                    minlength="4"
                    maxlength="50"
                    required
                >

            </div>


            <!-- TIPO DE CUENTA -->

            <div class="field">

                <label>
                    Tipo de usuario
                </label>

                <input
                    type="text"
                    value="Cliente"
                    readonly
                    aria-label="Tipo de usuario"
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="255"
                    required
                >

                <span class="password-info">
                    Utiliza mínimo 8 caracteres.
                </span>

            </div>


            <!-- CONFIRMAR CONTRASEÑA -->

            <div class="field">

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                    maxlength="255"
                    required
                >

            </div>


        </div>


        <!-- ==========================================
             TÉRMINOS
        =========================================== -->

        <div class="checkbox">

            <input
                type="checkbox"
                id="terminos"
                required
            >

            <label for="terminos">
                Acepto los términos y condiciones
            </label>

        </div>


        <!-- ==========================================
             BOTÓN
        =========================================== -->

        <button
            type="submit"
            id="btnRegistro"
        >
            Crear cuenta
        </button>


    </form>


    <!-- ==========================================
         VOLVER AL LOGIN
    =========================================== -->

    <div class="footer">

        ¿Ya tienes una cuenta?

        <a href="/">
            Iniciar sesión
        </a>

    </div>

</div>


<script src="{{ url_for('static', filename='js/registro.js') }}"></script>

</body>

</html>
